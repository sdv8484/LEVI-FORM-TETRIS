// ── Piece definitions ─────────────────────────────────────
//
// Shapes detected from 100-px grid analysis:
//   terra   → top-left 200×200 of image → L-shape [[1,0],[1,1]]
//   beige   → bottom half 300×100       → 3-bar   [[1,1,1]]
//   mosterd → bottom-left 200×100       → 2-bar   [[1,1]]
//
// srcX/Y/W/H = which region of the 300×200 image holds the piece content.
//
const PIECE_DEFS = [
  {
    id:'terra', imgKey:'terra',
    srcX:0, srcY:0, srcW:200, srcH:200,
    shapes:[
      [[1,0],[1,1]],  // 0° — J-style L
      [[1,1],[1,0]],  // 90°
      [[1,1],[0,1]],  // 180°
      [[0,1],[1,1]]   // 270°

  },
  {
    id:'beige', imgKey:'beige',
    srcX:0, srcY:100, srcW:300, srcH:100,
    shapes:[
      [[1,1,1]],      // 0° horizontal

// ── Game state ────────────────────────────────────────────
// board[r][c] = true (occupied) | null
// lockedPieces = array of whole-piece objects for visual rendering
let board, lockedPieces, score, lines, level, gameState;
let current, nextPiece, dropTimer, dropInterval;
let flashRows=[], flashTimer=0, particles=[];

function initGame(){
  board       = Array.from({length:ROWS},()=>Array(COLS).fill(null));
  lockedPieces = [];
  score=0; lines=0; level=1; dropInterval=800; dropTimer=0;
  flashRows=[]; flashTimer=0; particles=[];
  current   = spawn();
  nextPiece = spawn();
  gameState = 'playing';
}

function spawn(){
  const def = PIECE_DEFS[Math.floor(Math.random()*PIECE_DEFS.length)];
  const s   = def.shapes[0];
  return { def, rotation:0, x:Math.floor(COLS/2)-Math.floor(s[0].length/2), y:0 };
}

function getShape(p){ return p.def.shapes[p.rotation % p.def.shapes.length]; }

// ── Collision ─────────────────────────────────────────────
function collides(p,dx,dy,rot){
  const s = rot!==undefined ? p.def.shapes[rot%p.def.shapes.length] : getShape(p);
  for(let r=0;r<s.length;r++) for(let c=0;c<s[r].length;c++){
    if(!s[r][c]) continue;
    const nx=p.x+c+(dx||0), ny=p.y+r+(dy||0);
    if(nx<0||nx>=COLS||ny>=ROWS) return true;
    if(ny>=0&&board[ny][nx])    return true;
  }
  return false;
}

// ── Audio ─────────────────────────────────────────────────
let audioCtx = null;
let muted = false;
let musicNodes = [];
let musicLoopId = null;
let musicStartTime = 0;

function getAC(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}

function tone(freq, dur, type, vol, t){
  if(muted) return;
  const ac = getAC();
  const osc = ac.createOscillator();
  const g   = ac.createGain();
  osc.connect(g); g.connect(ac.destination);
  osc.type = type||'square';
  osc.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol||0.15, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  osc.start(t); osc.stop(t+dur+0.02);
  musicNodes.push(osc);
}

// Sound effects
function sfxMove()    { const ac=getAC(),t=ac.currentTime; tone(180,0.04,'square',0.06,t); }
function sfxRotate()  { const ac=getAC(),t=ac.currentTime; tone(280,0.07,'square',0.09,t); }
function sfxLock()    { const ac=getAC(),t=ac.currentTime; tone(140,0.08,'square',0.18,t); tone(95,0.14,'square',0.13,t+0.04); }
function sfxHardDrop(){ const ac=getAC(),t=ac.currentTime; tone(220,0.04,'square',0.18,t); tone(110,0.10,'square',0.20,t+0.03); }
function sfxLineClear(n){
  if(muted) return;
  const ac=getAC(), t=ac.currentTime;
  const freqs=[523,659,784,1047];
  for(let i=0;i<Math.min(n,4);i++) tone(freqs[i],0.14,'square',0.22,t+i*0.07);
}
function sfxGameOver(){
  if(muted) return;
  const ac=getAC(), t=ac.currentTime;
  [440,392,349,294,262,220].forEach((f,i)=>tone(f,0.28,'sawtooth',0.18,t+i*0.18));
}

  ['D5',1],['E5',1],['C5',1],['A4',1],['A4',2]
];
const THEME_B = [
  ['E5',.5],['C5',.5],['D5',.5],['B4',.5],['C5',.5],['A3',.5],[null,.5],['A3',.5],
  [null,.5],['A3',.5],['E4',1],['D5',.5],['C5',.5],['B4',1.5],['C5',.5],
  ['D5',1],['E5',1],['C5',1],['A4',1],['A4',1],[null,1],
  ['E5',.5],['C5',.5],['D5',.5],['B4',.5],['C5',.5],['E5',.5],['A5',1],
  ['A5',1],['G5',1],['null',1],
  ['E5',.5],['C5',.5],['D5',.5],['B4',.5],['C5',.5],['A3',.5],[null,.5],['A3',.5],
  [null,.5],['A3',.5],['E4',1],['D5',.5],['C5',.5],['B4',1.5],['C5',.5],
  ['D5',1],['E5',1],['C5',1],['A4',1],['A4',1],[null,1]
];

let musicPhase = 0; // 0=A, 1=A, 2=B, 3=B then repeat

function scheduleMusicLoop(){
  if(muted || !audioCtx) return;
  const ac = getAC();
  const seq = (musicPhase % 4 < 2) ? THEME_A : THEME_B;
  let t = ac.currentTime + 0.05;
  musicStartTime = t;
  let totalBeats = 0;
  seq.forEach(([note, beats])=>{
    if(note && NF[note]){
      tone(NF[note], beats*BEAT*0.88, 'square', 0.15, t);
    }
    t += beats * BEAT;
    totalBeats += beats;
  });
  const loopMs = totalBeats * BEAT * 1000 - 80;
  musicLoopId = setTimeout(()=>{
    musicPhase++;
    scheduleMusicLoop();
  }, loopMs);
}

function startMusic(){
  if(musicLoopId) return;
  getAC(); // ensure context exists after user gesture
  musicPhase = 0;
  scheduleMusicLoop();
}
function stopMusic(){
  if(musicLoopId){ clearTimeout(musicLoopId); musicLoopId=null; }
  musicNodes.forEach(n=>{ try{ n.stop(); }catch(e){} });
  musicNodes = [];
}
function toggleMute(){
  muted = !muted;
  if(muted) stopMusic();
  else if(gameState==='playing') { musicPhase=0; scheduleMusicLoop(); }
}

// Mute button: top of side panel
const MUTE_BTN = { x: PX, y: BY-40, w: PW, h: 28 };
function isMuteClick(cx,cy){ return cx>=MUTE_BTN.x&&cx<=MUTE_BTN.x+MUTE_BTN.w&&cy>=MUTE_BTN.y&&cy<=MUTE_BTN.y+MUTE_BTN.h; }

// ── Actions ───────────────────────────────────────────────
function moveLeft(){  if(!collides(current,-1,0)){ current.x--; sfxMove(); } }
function moveRight(){ if(!collides(current,+1,0)){ current.x++; sfxMove(); } }
function rotate(){
  const nr=(current.rotation+1)%current.def.shapes.length;
  for(const k of[0,1,-1,2,-2]){
    if(!collides(current,k,0,nr)){ current.x+=k; current.rotation=nr; sfxRotate(); return; }
  }
}
function softDrop(){
  if(!collides(current,0,1)){ current.y++; score++; dropTimer=0; }
  else lock();
}
function hardDrop(){
  let d=0; while(!collides(current,0,1)){current.y++;d++;}
  score+=d*2; sfxHardDrop(); lock();
}

// ── Lock ──────────────────────────────────────────────────
function lock(){
  const s   = getShape(current);
  const bbR = s.length, bbC = s[0].length;

  for(let r=0;r<bbR;r++) for(let c=0;c<bbC;c++){
    if(!s[r][c]) continue;
    const gr=current.y+r, gc=current.x+c;
    if(gr<0){ gameState='over'; return; }
    board[gr][gc] = true;
  }
  // store the whole piece for visual rendering
  lockedPieces.push({ def:current.def, rotation:current.rotation,
                      x:current.x, y:current.y });
  sfxLock();
  checkLines();
  current   = nextPiece;
  nextPiece = spawn();
  if(collides(current,0,0)){ gameState='over'; stopMusic(); sfxGameOver(); }
}

// ── Line clear ────────────────────────────────────────────
function checkLines(){
  const fullRows=[];
  for(let r=ROWS-1;r>=0;r--) if(board[r].every(c=>c!==null)) fullRows.push(r);
  if(!fullRows.length) return;

  // particles
  fullRows.forEach(row=>{
    for(let col=0;col<COLS;col++) for(let i=0;i<5;i++){
      particles.push({
        x:BX+col*CELL+CELL/2+(Math.random()-.5)*10, y:BY+row*CELL+CELL/2,
        vx:(Math.random()-.5)*5, vy:-Math.random()*5-1,
        life:1, decay:.022+Math.random()*.02, r:2+Math.random()*3,
        col:[YELLOW,'#FFF','#FFD249'][Math.floor(Math.random()*3)]
      });
    }
  });

  flashRows=[...fullRows]; flashTimer=240;
  setTimeout(()=>{
    const n=fullRows.length;

    // Remove any locked piece that has at least one cell in a cleared row
    lockedPieces = lockedPieces.filter(lp=>{
      const s=lp.def.shapes[lp.rotation%lp.def.shapes.length];
      for(let r=0;r<s.length;r++) for(let c=0;c<s[r].length;c++){
        if(s[r][c] && fullRows.includes(lp.y+r)) return false;
      }
      return true;
    });

    // Shift remaining pieces down by the number of cleared rows below them
    lockedPieces = lockedPieces.map(lp=>{
      const s=lp.def.shapes[lp.rotation%lp.def.shapes.length];
      const pBottom=lp.y+s.length-1;
      const drop=fullRows.filter(r=>r>pBottom).length;
      return drop ? {...lp, y:lp.y+drop} : lp;
    });

    // Rebuild board grid from remaining pieces
    board = Array.from({length:ROWS},()=>Array(COLS).fill(null));
    for(const lp of lockedPieces){
      const s=lp.def.shapes[lp.rotation%lp.def.shapes.length];
      for(let r=0;r<s.length;r++) for(let c=0;c<s[r].length;c++){
        if(!s[r][c]) continue;
        const gr=lp.y+r, gc=lp.x+c;
        if(gr>=0&&gr<ROWS&&gc>=0&&gc<COLS) board[gr][gc]=true;
      }
    }

    const pts=[0,100,300,500,800];
    score+=(pts[n]||800)*level; lines+=n;
    level=Math.floor(lines/10)+1;
    dropInterval=Math.max(120,800-(level-1)*65);
    flashRows=[];
    sfxLineClear(n);
  },220);
}

function ghostY(){
  let gy=current.y;
  while(!collides(current,0,gy-current.y+1)) gy++;
  return gy;
}

// ── Drawing helpers ───────────────────────────────────────
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

// ── Core piece image renderer ─────────────────────────────
// Draws a single piece (def+rotation) as one whole image at pixel (ox,oy).
// alpha: 0–1 for fading effects.
function drawPieceImage(def, rotation, ox, oy, cellSz, alpha){
  const img = IMG[def.imgKey];
  if(!img||!img.complete||!img.naturalWidth) return;
  const s   = def.shapes[rotation % def.shapes.length];
  const bbC = s[0].length, bbR = s.length;
  const dw  = bbC*cellSz, dh = bbR*cellSz;
  const rot = rotation % def.shapes.length;

  ctx.save();
  if(alpha!==undefined) ctx.globalAlpha=alpha;
  ctx.translate(ox+dw/2, oy+dh/2);
  ctx.rotate(rot*Math.PI/2);
  if(rot%2===1){
    ctx.drawImage(img, def.srcX, def.srcY, def.srcW, def.srcH,
                  -dh/2, -dw/2, dh, dw);
  } else {
    ctx.drawImage(img, def.srcX, def.srcY, def.srcW, def.srcH,
                  -dw/2, -dh/2, dw, dh);
  }
  ctx.restore();
}

// Draw all locked pieces as whole images (no cell grid)
function drawLockedPieces(){
  for(const lp of lockedPieces){
    const isFlashing = lp.def.shapes[lp.rotation%lp.def.shapes.length].some(
      (row,r)=>row.some((v,c)=>v&&flashRows.includes(lp.y+r))
    );
    const ox = BX + lp.x*CELL;
    const oy = BY + lp.y*CELL;
    if(isFlashing){
      // yellow flash overlay
      ctx.save();
      ctx.globalAlpha=0.75;
      ctx.fillStyle=YELLOW;
      const s=lp.def.shapes[lp.rotation%lp.def.shapes.length];
      for(let r=0;r<s.length;r++) for(let c=0;c<s[r].length;c++){
        if(s[r][c]) ctx.fillRect(ox+c*CELL+1, oy+r*CELL+1, CELL-2, CELL-2);
      }
      ctx.restore();
    } else {
      drawPieceImage(lp.def, lp.rotation, ox, oy, CELL);
    }
  }
}

// Draw the active falling piece as one whole image
function drawFallingPiece(){
  if(!current || gameState!=='playing') return;
  const s   = getShape(current);
  const bbR = s.length, bbC = s[0].length;
  // Check at least one cell is visible (not above board top)
  let visible=false;
  for(let r=0;r<bbR;r++) for(let c=0;c<bbC;c++){
    if(s[r][c]&&current.y+r>=0){ visible=true; break; }
  }
  if(!visible) return;
  const ox = BX + current.x*CELL;
  const oy = BY + current.y*CELL;
  drawPieceImage(current.def, current.rotation, ox, oy, CELL);
}

// Draw next-piece preview as whole image
function drawPreview(piece, ox, oy, cellSz){
  drawPieceImage(piece.def, piece.rotation, ox, oy, cellSz);
}

// ── Board ─────────────────────────────────────────────────
function drawBoard(){
  ctx.fillStyle='#080808'; rr(BX-1,BY-1,BW+2,BH+2,4); ctx.fill();
  // subtle grid dots
  for(let r=0;r<=ROWS;r++) for(let c=0;c<=COLS;c++){
    ctx.fillStyle='#1c1c1c';
    ctx.fillRect(BX+c*CELL-.5, BY+r*CELL-.5, 1, 1);
  }

  // clip everything inside the board
  ctx.save();
  rr(BX,BY,BW,BH,4); ctx.clip();

  // locked pieces as whole images
  drawLockedPieces();

  // ghost piece outline
  if(current && gameState==='playing'){
    const gy=ghostY(), s=getShape(current);
    if(gy!==current.y){
      drawPieceImage(current.def, current.rotation,
                     BX+current.x*CELL, BY+gy*CELL, CELL, 0.18);
    }
  }

  // falling piece
  drawFallingPiece();

  ctx.restore();

  // board border
  ctx.strokeStyle=YELLOW+'50'; ctx.lineWidth=1;
  rr(BX,BY,BW,BH,4); ctx.stroke();
}

// ── Game loop ─────────────────────────────────────────────
let lastTs=0;
function loop(ts){
  const dt=ts-lastTs; lastTs=ts;
  if(gameState==='playing'&&flashTimer<=0){
    dropTimer+=dt;
    if(dropTimer>=dropInterval){
      dropTimer=0;
      if(!collides(current,0,1)) current.y++;
      else lock();
    }
  }
  if(flashTimer>0) flashTimer-=dt;
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.09;p.life-=p.decay;});
  render();
  requestAnimationFrame(loop);
}

// ── Input ─────────────────────────────────────────────────
function tryStart(){ if(gameState!=='playing'){ initGame(); startMusic(); } }

document.addEventListener('keydown',e=>{
  if(e.repeat) return;
  if(gameState!=='playing'){ tryStart(); return; }
  switch(e.key){
    case'ArrowLeft': moveLeft();   break;
    case'ArrowRight':moveRight();  break;
    case'ArrowDown': softDrop();   break;
    case'ArrowUp':   rotate();     break;
    case' ':         hardDrop();   break;
    case'm': case'M': toggleMute(); break;
  }
  if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].includes(e.key)) e.preventDefault();
});

let tx0=0,ty0=0,tt0=0;
canvas.addEventListener('touchstart',e=>{
  tx0=e.touches[0].clientX; ty0=e.touches[0].clientY; tt0=Date.now(); e.preventDefault();
},{passive:false});
canvas.addEventListener('touchend',e=>{
  const t=e.changedTouches[0];
  const dx=t.clientX-tx0, dy=t.clientY-ty0, dt=Date.now()-tt0;
  const rect=canvas.getBoundingClientRect();
  const scaleX=W/rect.width, scaleY=H/rect.height;
  const cx=(t.clientX-rect.left)*scaleX, cy=(t.clientY-rect.top)*scaleY;

  // FORM Collection button tap – handle before anything else
  if(isFormBtnClick(cx,cy)){
    window.open('https://www.levipartyrental.be/nl/nieuws/new-form','_blank');
    e.preventDefault(); return;
  }

  if(gameState!=='playing'){tryStart();e.preventDefault();return;}

  const adx=Math.abs(dx),ady=Math.abs(dy);
  // Tap (no significant movement) → rotate only if inside board area
  if(adx<8&&ady<8){
    const inBoard=(cx>=BX&&cx<=BX+BW&&cy>=BY&&cy<=BY+BH);
    if(inBoard) rotate();
    e.preventDefault(); return;
  }
  // Swipe: lower thresholds for snappier response
  if(adx>ady){
    // Horizontal swipe
    if(adx>12){ if(dx>0) moveRight(); else moveLeft(); }
  } else {
    // Vertical swipe
    if(ady>12){
      if(dy>0){ if(dt<200) hardDrop(); else softDrop(); }
      else rotate();
    }
  }
  e.preventDefault();
},{passive:false});
canvas.addEventListener('click',e=>{
  const rect=canvas.getBoundingClientRect();
  const scaleX=W/rect.width, scaleY=H/rect.height;
  const cx=(e.clientX-rect.left)*scaleX, cy=(e.clientY-rect.top)*scaleY;
  if(isMuteClick(cx,cy)){ toggleMute(); return; }
  if(isFormBtnClick(cx,cy)){ window.open('https://www.levipartyrental.be/nl/nieuws/new-form','_blank'); return; }
  if(gameState!=='playing') tryStart();
});

// ── Boot ──────────────────────────────────────────────────
gameState='start';
board=Array.from({length:ROWS},()=>Array(COLS).fill(null));
score=0; lines=0; level=1;
document.fonts.ready.then(()=>requestAnimationFrame(loop));
</script>
